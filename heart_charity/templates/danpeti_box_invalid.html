<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ error_title|default:"Donation Box Notice" }} | Ahinsadham</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eaf4eb 0%, #e2efe3 100%);
      color: #212529;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .notice-card {
      background: #ffffff;
      max-width: 540px;
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(22, 101, 52, 0.12);
      border: 1px solid #d4ebd7;
      padding: 45px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .notice-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #15803d, #eab308, #dc2626);
    }
    .icon-wrapper {
      width: 86px;
      height: 86px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #fef2f2;
      border: 2px solid #fecaca;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #dc2626;
    }
    .icon-wrapper.warning {
      background: #fefce8;
      border-color: #fef08a;
      color: #ca8a04;
    }
    h2 {
      font-size: 26px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 15px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .box-info-pill {
      display: inline-block;
      background: #f1f5f9;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      color: #334155;
      font-weight: 600;
      margin-bottom: 30px;
      border: 1px solid #e2e8f0;
    }
    .btn-group-custom {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary-action {
      background: linear-gradient(135deg, #166534 0%, #15803d 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22, 101, 52, 0.25);
    }
    .btn-primary-action:hover {
      background: linear-gradient(135deg, #14532d 0%, #166534 100%);
      transform: translateY(-1px);
    }
    .btn-secondary-action {
      background: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary-action:hover {
      background: #f1f5f9;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="notice-card">
    <div class="icon-wrapper {% if current_box and current_box.status != 'Active' %}warning{% endif %}">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h2>{{ error_title|default:"Donation Box Unavailable" }}</h2>
    <p class="error-desc">{{ error_message|default:"The requested Donation Box could not be verified." }}</p>
    {% if box_id %}
      <div class="box-info-pill">
        Scanned Box Identifier: <strong>{{ box_id }}</strong>
      </div>
    {% endif %}
    <div class="btn-group-custom">
      <a href="{% url 'schemes' %}" class="btn btn-primary-action">
        <i class="bi bi-heart-fill"></i> View Other Donation Schemes
      </a>
      <a href="/" class="btn btn-secondary-action">
        <i class="bi bi-house"></i> Return to Homepage
      </a>
    </div>
  </div>
</body>
</html>
