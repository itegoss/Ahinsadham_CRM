{% extends "base.html" %}
{% block title %}Add Owner Details{% endblock %}
{% block content %}
<style>
/* ==========================================
   FORM ACCORDION & CARDS STYLING
   Ahinsadham CRM Theme Colors Preserved
   ========================================== */
.form-page-container {
    max-width: 1200px;
    margin: 0 auto;
}

.form-page-header {
    background: transparent;
    margin-bottom: 24px;
}

.form-page-title {
    color: #065F46;
    font-weight: 700;
    font-size: 1.65rem;
    margin-bottom: 4px;
}

.form-page-subtitle {
    color: #64748b;
    font-size: 0.92rem;
    margin: 0;
}



/* Base Card */
.form-card {
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #d1fae5;
    box-shadow: 0 4px 18px rgba(6, 78, 59, 0.05);
    margin-bottom: 20px;
    overflow: hidden;
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
}

.form-card:hover {
    box-shadow: 0 6px 24px rgba(6, 78, 59, 0.08);
}

/* Accordion Header */
.accordion-card-header {
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    background: #ffffff;
    transition: background-color 0.2s ease, border-color 0.2s ease;
}

.accordion-card-header:hover {
    background-color: #f7fdf9;
}

.accordion-card-title {
    font-size: 1.12rem;
    font-weight: 700;
    color: #065F46;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
}

.accordion-chevron-icon {
    font-size: 0.95rem;
    color: #059669;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.form-card.is-open .accordion-chevron-icon {
    transform: rotate(180deg);
}

/* Accordion Content */
.accordion-card-content {
    display: block;
    padding: 6px 28px 26px 28px;
    border-top: 1px solid #ecfdf5;
    background: #ffffff;
}

.form-card:not(.is-open) .accordion-card-content {
    display: none;
}

/* Form Controls */
.form-label {
    font-weight: 600;
    font-size: 0.86rem;
    color: #334155;
    margin-bottom: 6px;
    display: block;
}

.req-star {
    color: #dc2626;
    margin-left: 2px;
}

.form-control, .form-select {
    border-radius: 8px;
    border: 1.5px solid #cbd5e1;
    padding: 9px 13px;
    font-size: 0.92rem;
    color: #1e293b;
    background-color: #ffffff;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.form-control:focus, .form-select:focus {
    border-color: #059669;
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    outline: none;
}

.form-control::placeholder {
    color: #94a3b8;
    font-size: 0.88rem;
}

/* Grid for name row */
.name-grid-row {
    display: grid;
    grid-template-columns: 100px 1fr 1fr 1fr;
    gap: 16px;
}

@media (max-width: 768px) {
    .name-grid-row {
        grid-template-columns: 1fr;
    }
}

/* Custom Phone Group */
.custom-phone-group {
    display: flex !important;
    align-items: stretch !important;
    width: 100% !important;
    height: 42px !important;
    gap: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
}

.custom-phone-group .country-code-select {
    width: 88px !important;
    min-width: 88px !important;
    max-width: 88px !important;
    flex: 0 0 88px !important;
    border: 1.5px solid #cbd5e1 !important;
    border-right: none !important;
    border-top-left-radius: 8px !important;
    border-bottom-left-radius: 8px !important;
    border-top-right-radius: 0 !important;
    border-bottom-right-radius: 0 !important;
    background-color: #f8fafc !important;
    font-weight: 600 !important;
    font-size: 0.9rem !important;
    color: #1e293b !important;
    padding: 8px 6px 8px 10px !important;
    height: 42px !important;
    margin: 0 !important;
    box-sizing: border-box !important;
    cursor: pointer !important;
}

.custom-phone-group .country-code-select:focus {
    border-color: #047857 !important;
    box-shadow: none !important;
    z-index: 2 !important;
}

.custom-phone-group .form-control {
    flex: 1 1 auto !important;
    width: 1% !important;
    min-width: 0 !important;
    border: 1.5px solid #cbd5e1 !important;
    border-top-left-radius: 0 !important;
    border-bottom-left-radius: 0 !important;
    border-top-right-radius: 8px !important;
    border-bottom-right-radius: 8px !important;
    height: 42px !important;
    margin: 0 !important;
    box-sizing: border-box !important;
}

.custom-phone-group .form-control:focus {
    border-color: #047857 !important;
    z-index: 3 !important;
}

/* Actions Bar */
.form-actions-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 24px;
    margin-bottom: 40px;
    padding: 8px 4px;
}

.btn-submit {
    background: linear-gradient(135deg, #0d7a34 0%, #10B981 100%) !important;
    color: #ffffff !important;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 10px 32px;
    border-radius: 8px;
    border: none;
    box-shadow: 0 4px 14px rgba(13, 122, 52, 0.28);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
    cursor: pointer;
}

.btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(13, 122, 52, 0.35);
}

.back-btn {
    background: #ffffff;
    color: #475569;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 9px 24px;
    border-radius: 8px;
    border: 1.5px solid #cbd5e1;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.back-btn:hover {
    background: #f1f5f9;
    color: #1e293b;
    border-color: #94a3b8;
}
</style>


<div class="container form-page-container mt-4 mb-5">
    <!-- Header (Centered Title & Subtitle) -->
    <div class="position-relative text-center mb-4 form-page-header">
        <h3 class="form-page-title text-center">Add Owner Details</h3>
        <p class="form-page-subtitle text-center"><hr style="width: 50%; margin: 20px auto; border: 0; border-top: 2px solid #ccc;"></p>
        <div class="position-absolute end-0 top-50 translate-middle-y d-none d-sm-block">
            <button type="button" class="btn btn-sm btn-outline-success" id="toggleAllSectionsBtn" style="font-weight: 600; border-radius: 8px; font-size: 0.85rem; padding: 7px 16px;">
                <i class="fa-solid fa-layer-group me-1"></i> <span id="toggleAllText">Collapse All</span>
            </button>
        </div>
        <div class="d-block d-sm-none mt-2 text-center">
            <button type="button" class="btn btn-sm btn-outline-success" onclick="document.getElementById('toggleAllSectionsBtn').click();" style="font-weight: 600; border-radius: 8px; font-size: 0.85rem; padding: 6px 14px;">
                <i class="fa-solid fa-layer-group me-1"></i> Toggle All
            </button>
        </div>
    </div>

    <form method="POST" enctype="multipart/form-data" id="ownerDetailsForm">
        {% csrf_token %}

        <!-- ===================================== 1. BUSINESS DETAILS ===================================== -->
        <div class="form-card is-open" id="businessDetailsCard">
            <div class="accordion-card-header" onclick="toggleAccordion(this)">
                <h5 class="accordion-card-title">
                    <i class="fa-solid fa-building text-success"></i> Business Details
                </h5>
                <i class="fa-solid fa-chevron-down accordion-chevron-icon"></i>
            </div>
            <div class="accordion-card-content">
                <div class="row g-3 mb-2">
                    <div class="col-md-6">
                        <label class="form-label">Business Name <span class="req-star">*</span></label>
                        <input type="text" name="business_name" class="form-control" placeholder="Enter business / firm / shop name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">GST <span class="req-star">*</span></label>
                        <input type="text" name="gst_number" class="form-control" placeholder="Enter GST number" minlength="15" maxlength="15" required pattern="^[a-zA-Z0-9]{15}$" title="GST Number must be exactly 15 alphanumeric characters">
                    </div>
                </div>
            </div>
        </div>

        <!-- ===================================== 3. ADDRESS DETAILS ===================================== -->
        <div class="form-card is-open" id="addressDetailsCard">
            <div class="accordion-card-header" onclick="toggleAccordion(this)">
                <h5 class="accordion-card-title">
                    <i class="fa-solid fa-location-dot text-success"></i>Business Address Details
                </h5>
                <i class="fa-solid fa-chevron-down accordion-chevron-icon"></i>
            </div>
            <div class="accordion-card-content">
                <!-- Address line 1 & line 2 -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Address Line 1 <span class="req-star">*</span></label>
                        <input type="text" name="address_line_1" id="address_line_1" class="form-control" placeholder="House/Flat/Shop no., Building, Street" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address Line 2</label>
                        <input type="text" name="address_line_2" id="address_line_2" class="form-control" placeholder="Landmark, locality">
                    </div>
                </div>

                <!-- Area & Postal Code -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Area/Town <span class="req-star">*</span></label>
                        <input type="text" name="area" class="form-control" placeholder="Borivali/Vashi/Bhujpur" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Postal Code <span class="req-star">*</span></label>
                        <input type="text" name="postal_code" class="form-control" placeholder="Enter postal code" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>
                </div>

                <!-- Zone & City -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Zone</label>
                        <input type="text" name="zone" class="form-control" placeholder="Enter zone">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">City <span class="req-star">*</span></label>
                        <input type="text" name="city" class="form-control" placeholder="Mumbai/Ahmedabad" required>
                    </div>
                </div>

                <!-- Country, State -->
                <div class="row g-3 mb-2">
                    <div class="col-md-6">
                        <label class="form-label">Country <span class="req-star">*</span></label>
                        <select id="country" name="country" class="form-select" required>
                            <option value="India" selected>India</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="United Arab Emirates">United Arab Emirates</option>
                            <option value="Australia">Australia</option>
                            <option value="Canada">Canada</option>
                            <option value="Singapore">Singapore</option>
                            <option value="Germany">Germany</option>
                            <option value="France">France</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6" id="stateDropdownBox">
                        <label class="form-label">State <span class="req-star">*</span></label>
                        <select id="state" name="state" class="form-select">
                        </select>
                    </div>
                    <div class="col-md-6" id="stateTextboxBox" style="display: none;">
                        <label class="form-label">State <span class="req-star">*</span></label>
                        <input type="text" id="state_text" name="state_text" class="form-control" placeholder="Enter State">
                    </div>
                </div>
            </div>
        </div>


        <!-- ===================================== 2. PERSONAL DETAILS ===================================== -->
        <div class="form-card is-open" id="personalDetailsCard">
            <div class="accordion-card-header" onclick="toggleAccordion(this)">
                <h5 class="accordion-card-title">
                    <i class="fa-solid fa-user text-success"></i> Personal Details
                </h5>
                <i class="fa-solid fa-chevron-down accordion-chevron-icon"></i>
            </div>
            <div class="accordion-card-content">
                <!-- Row 1: Name fields with dedicated Salutation column and equal Name columns -->
                <div class="name-grid-row mb-4">
                    <div>
                        <label class="form-label">Sal.</label>
                        <select name="salutation" class="form-select">
                            <option value="">—</option>
                            <option>Mr.</option>
                            <option>Mrs.</option>
                            <option>Ms.</option>
                            <option>Shri</option>
                            <option>Smt.</option>
                            <option>Kumari</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">First Name <span class="req-star">*</span></label>
                        <input type="text" name="first_name" class="form-control" placeholder="Enter first name" oninput="this.value = this.value.replace(/[^A-Za-z]/g, '')" required>
                    </div>
                    <div>
                        <label class="form-label">Middle Name</label>
                        <input type="text" name="middle_name" class="form-control" placeholder="Enter middle name" oninput="this.value = this.value.replace(/[^A-Za-z]/g, '')">
                    </div>
                    <div>
                        <label class="form-label">Last Name <span class="req-star">*</span></label>
                        <input type="text" name="last_name" class="form-control" placeholder="Enter last name" oninput="this.value = this.value.replace(/[^A-Za-z]/g, '')" required>
                    </div>
                </div>

                <!-- Row 2: Gender and Blood Group -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select">
                            <option value="">Select</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Blood Group</label>
                        <select name="blood_group" class="form-select text-dark">
                            <option value="">Select</option>
                            {% for bg, val in blood_groups %}
                                <option value="{{ bg }}">{{ bg }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Row 3: Contact Number, WhatsApp Number, Email (Perfect Grid & Vertical Alignment) -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="d-flex justify-content-between align-items-center" style="min-height: 22px; margin-bottom: 6px;">
                            <label class="form-label mb-0">Contact Number <span class="req-star">*</span></label>
                        </div>
                        <div class="custom-phone-group">
                            <select class="country-code-select" name="contact_country_code" required>
                                <option value="+91" selected>+91</option>
                                <option value="+1">+1</option>
                                <option value="+44">+44</option>
                                <option value="+971">+971</option>
                                <option value="+61">+61</option>
                                <option value="+65">+65</option>
                            </select>
                            <input type="text" name="contact_number" id="contact_number" class="form-control" placeholder="Enter phone number" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="d-flex justify-content-between align-items-center" style="min-height: 22px; margin-bottom: 6px;">
                            <label class="form-label mb-0">WhatsApp Number</label>
                            <label class="form-check-label text-muted d-flex align-items-center gap-1" for="different_whatsapp" style="font-size: 0.8rem; cursor: pointer; user-select: none;">
                                <input class="form-check-input mt-0" type="checkbox" id="different_whatsapp" style="cursor: pointer;">
                                <span>Different number</span>
                            </label>
                        </div>
                        <div class="custom-phone-group">
                            <select class="country-code-select" name="whatsapp_country_code">
                                <option value="+91" selected>+91</option>
                                <option value="+1">+1</option>
                                <option value="+44">+44</option>
                                <option value="+971">+971</option>
                                <option value="+61">+61</option>
                                <option value="+65">+65</option>
                            </select>
                            <input type="text" name="whatsapp_number" id="whatsapp_number" class="form-control" maxlength="10" placeholder="Enter whatsapp number" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="d-flex justify-content-between align-items-center" style="min-height: 22px; margin-bottom: 6px;">
                            <label class="form-label mb-0">Email</label>
                        </div>
                        <input type="email" name="email" class="form-control" placeholder="Enter email address" style="height: 42px;">
                    </div>
                </div>

                <!-- Row 4: DOB, Age, Native Place -->
                <div class="row g-3 mb-2">
                    <div class="col-md-4">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="date_of_birth" id="date_of_birth" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Age</label>
                        <input type="number" name="age" id="age" class="form-control" style="background-color: #f8fafc;" placeholder="Age" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Native Place</label>
                        <input type="text" name="native_place" class="form-control" placeholder="Enter native place">
                    </div>
                </div>
            </div>
        </div>



        <!-- ===================================== ACTION BUTTONS ===================================== -->
        <div class="form-actions-bar">
            <button type="submit" class="action-btn btn btn-submit">
                <i class="fa-solid fa-check"></i> Save
            </button>
            <a href="{% url 'owner_details_page' %}" class="action-btn back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back
            </a>
        </div>

    </form>
</div>

<!-- ================= SCRIPTS ================= -->
<script>
/* Accordion toggle */
function toggleAccordion(header) {
    const card = header.closest('.form-card');
    card.classList.toggle('is-open');
}

/* Expand / Collapse All */
const toggleAllBtn = document.getElementById('toggleAllSectionsBtn');
const toggleAllText = document.getElementById('toggleAllText');
let allExpanded = true;

if (toggleAllBtn) {
    toggleAllBtn.addEventListener('click', function () {
        const cards = document.querySelectorAll('.form-card');
        allExpanded = !allExpanded;
        cards.forEach(card => {
            if (allExpanded) {
                card.classList.add('is-open');
            } else {
                card.classList.remove('is-open');
            }
        });
        toggleAllText.textContent = allExpanded ? 'Collapse All' : 'Expand All';
    });
}

/* WhatsApp same as Contact checkbox */
const diffWhatsappCheckbox = document.getElementById('different_whatsapp');
const contactInput = document.getElementById('contact_number');
const whatsappInput = document.getElementById('whatsapp_number');

if (diffWhatsappCheckbox && contactInput && whatsappInput) {
    contactInput.addEventListener('input', function() {
        if (!diffWhatsappCheckbox.checked) {
            whatsappInput.value = this.value;
        }
    });
    diffWhatsappCheckbox.addEventListener('change', function() {
        if (!this.checked) {
            whatsappInput.value = contactInput.value;
        }
    });
}

/* Age Calculation from DOB */
const dobInput = document.getElementById("date_of_birth");
if (dobInput) {
    dobInput.addEventListener("change", function () {
        let dob = new Date(this.value);
        if (!isNaN(dob)) {
            let diff = Date.now() - dob.getTime();
            let age = new Date(diff).getUTCFullYear() - 1970;
            const ageEl = document.getElementById("age");
            if (ageEl) ageEl.value = age > 0 ? age : 0;
        }
    });
}

/* India States Dropdown */
const indiaStates = [
  "Andaman and Nicobar Islands", "Andhra Pradesh", "Arunachal Pradesh", "Assam",
  "Bihar", "Chandigarh", "Chhattisgarh", "Dadra and Nagar Haveli and Daman and Diu",
  "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jammu and Kashmir",
  "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "Madhya Pradesh",
  "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha",
  "Puducherry", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana",
  "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"
];

function populateStates(selectedState) {
    const countryEl = document.getElementById('country');
    const dropdownBox = document.getElementById('stateDropdownBox');
    const textboxBox = document.getElementById('stateTextboxBox');
    const stateSelect = document.getElementById('state');
    if (!countryEl || !dropdownBox || !textboxBox || !stateSelect) return;

    if (countryEl.value === "India") {
        dropdownBox.style.display = "block";
        textboxBox.style.display = "none";
        stateSelect.innerHTML = '<option value="">Select State</option>';
        indiaStates.forEach(function(state) {
            let opt = document.createElement("option");
            opt.value = state;
            opt.text = state;
            if (selectedState && state === selectedState) {
                opt.selected = true;
            }
            stateSelect.appendChild(opt);
        });
    } else {
        dropdownBox.style.display = "none";
        textboxBox.style.display = "block";
    }
}

document.addEventListener("DOMContentLoaded", function() {
    populateStates("Gujarat");
    const countryEl = document.getElementById('country');
    if (countryEl) {
        countryEl.addEventListener('change', function() {
            populateStates();
        });
    }
});
</script>
{% endblock %}
