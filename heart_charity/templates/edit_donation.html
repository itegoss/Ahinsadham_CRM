{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Donation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4faf4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(4px);
        }
        .popup-card {
            position: relative;
            width: 90%;
            max-width: 1100px;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.2);
            animation: popup 0.4s ease;
        }
        @keyframes popup {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .title {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            color: #1e7a33;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            font-size: 18px;
            color: gray;
            margin-bottom: 35px;
        }
        .section-label {
            font-size: 22px;
            color: green;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .line {
            width: 100%;
            height: 2px;
            background: #d1e5d1;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 40px;
            row-gap: 25px;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }
        .form-group input, 
        .form-group select, 
        .form-group textarea {
            color:black;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #cce4cc;
            font-size: 16px;
            background: #f8fff8;
            transition: .3s ease;
        }
        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            background: white;
            border-color: #2f7d35;
            outline: none;
        }
        .form-group textarea {
            resize: none;
        }
        .btn-area {
            margin-top: 40px;
            text-align: center;
        }
        button {
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin: 0 15px;
        }
        .btn-submit {
            background: #21873b;
            color: white;
        }
        .btn-submit:hover {
            background: #17612a;
        }
        .btn-back {
            background: #6c757d;
            color: white;
        }
        .btn-back:hover {
            background: #565e64;
        }
        .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            font-size: 22px;
            cursor: pointer;
            background: none;
            border: none;
            color: #333;
        }
        .close-btn:hover {
            color: red;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .select2-container--default .select2-selection--single {
            border: 2px solid #cce4cc !important;
            border-radius: 10px !important;
            height: 48px !important;
            background: #f8fff8 !important;
            font-size: 16px !important;
            padding: 8px 14px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 44px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 28px !important;
            color: black !important;
            padding-left: 0 !important;
        }
    </style>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Select2 CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body>
<div class="overlay"></div>
<div class="popup-card">
    <button class="close-btn" onclick="window.history.back()">✖</button>
    <div class="title">Edit Donation</div>
    <div class="subtitle">Please update the required details below</div>
    <div class="section-label">Donation Details</div>
    <div class="line"></div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label>Donor</label>
                <select name="donor" id="donor" class="form-select select2-search" required>
                    {% if donation.donor %}
                        <option value="{{ donation.donor.id }}" selected>{{ donation.donor.first_name }} {{ donation.donor.last_name }}</option>
                    {% endif %}
                </select>
            </div>
            <div class="form-group">
                <label>Donation Date</label>
                <input type="date" name="donation_date" value="{{ donation.donation_date|date:'Y-m-d' }}">
            </div>
            <div class="form-group">
                <label>Donation Category</label>
                <select name="donation_category">
                    {% for c in donation_categories %}
                        <option value="{{ c.id }}" {% if donation.donation_category_id == c.id %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select name="payment_method">
                    {% for pm in payment_methods %}
                        <option value="{{ pm.id }}" {% if donation.payment_method_id == pm.id %}selected{% endif %}>{{ pm }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Payment Status</label>
                <select name="payment_status">
                    {% for ps in payment_statuses %}
                        <option value="{{ ps.id }}" {% if donation.payment_status_id == ps.id %}selected{% endif %}>{{ ps }} </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Transaction ID</label>
                <input type="text" name="transaction_id" value="{{ donation.transaction_id }}">
            </div>
            <div class="form-group">
                <label>Receipt ID</label>
                <input type="text" name="receipt_id" value="{{ donation.receipt_id }}">
            </div>
            <div class="form-group">
                <label>Cheque Number</label>
                <input type="text" name="check_no" value="{{ donation.check_no }}">
            </div>
            <div class="form-group">
                <label>Place of Donation</label>
                <select name="place_of_donation">
                    <option value="">-- Select Place --</option>
                    <option value="KO" {% if donation.place_of_donation == "KO" %}selected{% endif %}>KO</option>
                    <option value="MO" {% if donation.place_of_donation == "MO" %}selected{% endif %}>MO</option>
                    <option value="KDP" {% if donation.place_of_donation == "KDP" %}selected{% endif %}>KDP</option>
                    <option value="MDP" {% if donation.place_of_donation == "MDP" %}selected{% endif %}>MDP</option>
                </select>
            </div>
            <div class="form-group">
                <label>Declared Amount</label>
                <input type="number" name="donation_amount_declared" value="{{ donation.donation_amount_declared }}" step="0.01">
            </div>
            <div class="form-group">
                <label>Paid Amount</label>
                <input type="number" name="donation_amount_paid" value="{{ donation.donation_amount_paid }}" step="0.01">
            </div>
            <div class="form-group full-width">
                <label>Description</label>
                <textarea name="description" rows="3">{{ donation.description }}</textarea>
            </div>
        </div>
        <div class="btn-area">
            <button type="submit" class="btn-submit">✔ Update</button>
            <a href="{% url 'welcome' %}"><button type="button" class="btn-back">← Back</button></a>
        </div>
    </form>
</div>
<script>
$(document).ready(function() {
    $('#donor').select2({
        placeholder: "Search Donor...",
        allowClear: true,
        width: '100%',
        ajax: {
            url: "{% url 'donor_autocomplete_ajax' %}?person_type=donor",
            dataType: 'json',
            delay: 250,
            data: function (params) {
                return {
                    q: params.term
                };
            },
            processResults: function (data) {
                return {
                    results: data.results
                };
            },
            cache: true
        },
        minimumInputLength: 1
    });
});
</script>
</body>
</html>
