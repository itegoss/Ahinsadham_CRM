{% extends 'base.html' %}
{% block title %}Add Donation Box{% endblock %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    .page-wrapper {
        background: #f2fbf3; 
        padding: 20px 15px;
        min-height: calc(100vh - 110px);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .container-box {
        width: 100%;
        max-width: 920px;
        padding: 24px 35px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .page-title {
        text-align: center;
        font-size: 24px;
        color: #0f7b34;
        font-weight: 700;
        margin-bottom: 2px;
    }
    .page-subtitle {
        text-align: center;
        font-size: 13px;
        color: #5f6f61;
        margin-bottom: 16px;
    }
    .section-title {
        font-size: 15px;
        font-weight: 700;
        color: #166534;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    hr {
        border: none;
        border-top: 1px solid #d9e8d6;
        margin-top: 4px;
        margin-bottom: 16px;
    }
    .field-label {
        font-size: 13px;
        font-weight: 600;
        color: #2d3748;
        margin-bottom: 4px;
        display: block;
    }
    .form-control, .form-select {
        height: 42px;
        border-radius: 8px;
        border: 1px solid #cddfcc;
        background: #ffffff;
        font-size: 14px;
        padding: 8px 12px;
        transition: .2s;
        text-align: left !important;
    }
    .form-control:focus, .form-select:focus {
        border-color: #0f7b34;
        box-shadow: 0 0 0 3px rgba(15, 123, 52, 0.15);
        background: #ffffff;
    }
    .radio-group {
        display: flex;
        gap: 12px;
        align-items: center;
        height: 42px;
    }
    .radio-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid #cddfcc;
        background: #fafafa;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: .2s;
        margin-bottom: 0;
        user-select: none;
    }
    .radio-option:hover {
        background: #eef8f0;
        border-color: #0f7b34;
    }
    .radio-option input[type="radio"] {
        accent-color: #0f7b34;
        margin: 0;
        cursor: pointer;
    }
    .action-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 16px;
    }
    .action-btn {
        padding: 9px 36px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: .2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }
    .save-btn {
        background: #0f7b34;
        color: white;
    }
    .save-btn:hover {
        background: #0c622a;
        transform: translateY(-1px);
        color: white;
    }
    .back-btn {
        background: #6b6f75;
        color: white;
    }
    .back-btn:hover {
        background: #4b4f54;
        transform: translateY(-1px);
        color: white;
    }
    .select2-container,
    .select2-container * {
        text-align: left !important;
    }
    .select2-container .select2-selection--single {
        position: relative !important;
        height: 42px !important;
        border-radius: 8px !important;
        border: 1px solid #cddfcc !important;
        display: flex !important;
        align-items: center !important;
        padding: 0 12px !important;
        text-align: left !important;
        justify-content: flex-start !important;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        line-height: 40px !important;
        padding-left: 0 !important;
        padding-right: 24px !important;
        margin: 0 !important;
        font-size: 14px !important;
        color: #2d3748 !important;
        text-align: left !important;
        display: block !important;
        width: 100% !important;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 40px !important;
        right: 8px !important;
    }
    .select2-container--default .select2-selection--single .select2-selection__clear {
        position: absolute !important;
        right: 25px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        color: #888 !important;
        width: auto !important;
        height: auto !important;
        font-size: 16px !important;
        line-height: 1 !important;
    }
    .qr-badge-alert {
        background-color: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
        border-radius: 8px;
        font-size: 12.5px;
        padding: 9px 14px;
        display: flex;
        align-items: center;
        height: 42px;
        gap: 8px;
    }
</style>

<div class="page-wrapper">
    <div class="container-box">
        <h2 class="page-title">Add New Donation Box</h2>
 <p class="form-page-subtitle text-center"><hr style="width: 50%; margin: 20px auto; border: 0; border-top: 2px solid #ccc;"></p>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="section-title">
                <i class="fa-solid fa-box-archive text-success"></i> Donation Box Information
            </div>
            <hr>

            <div class="row g-3">
                <!-- Row 1: Key Number & Box Size -->
                <div class="col-md-6">
                    <label class="field-label">Key Number <span style="color: #d9534f;">*</span></label>
                    <input type="text" name="key_id" class="form-control" placeholder="Enter Key ID" required aria-required="true">
                </div>
                <div class="col-md-6">
                    <label class="field-label">Box Size <span style="color: #d9534f;">*</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="box_size" value="small" required aria-required="true"> Small
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="box_size" value="medium" checked required aria-required="true"> Medium
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="box_size" value="large" required aria-required="true"> Large
                        </label>
                    </div>
                </div>

                <!-- Row 2: Old Box ID & Commission % -->
                <div class="col-md-6">
                    <label class="field-label">Old Box ID</label>
                    <input type="text" name="old_box_id" class="form-control" placeholder="Enter Old Box ID">
                </div>
                <div class="col-md-6">
                    <label class="field-label">Commission % <span style="color: #d9534f;">*</span></label>
                    <input 
                        type="number" 
                        name="box_percentage" 
                        placeholder="Enter Percentage (e.g. 10)"
                        class="form-control"
                        min="0" 
                        max="100" 
                        step="0.01"
                        required
                    >
                </div>

                <!-- Row 3: Collector & Daanpeti Donor -->
                <div class="col-md-6">
                    <label class="field-label">Collector Name <span style="color: #d9534f;">*</span></label>
                    <select name="box_owner" id="box_owner" class="form-select" required>
                        <option value="">Select Collector</option>
                        {% for emp in employees %}
                            <option value="{{ emp.first_name }} {{ emp.last_name }}">{{ emp.first_name }} {{ emp.last_name }}{% if emp.designation %} - {{ emp.designation.lookup_name }}{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="field-label">Daanpeti Donor</label>
                    <select name="assigned_to" id="assigned_to" class="form-select">
                        <option value="">Select Donor</option>
                        {% for owner in owners %}
                            <option value="{{ owner.id }}">{% if owner.business_name %}{{ owner.business_name }} ({% endif %}{{ owner.first_name }} {{ owner.last_name }}{% if owner.business_name %}){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Row 4: Status & Auto QR Code -->
                <div class="col-md-6">
                    <label class="field-label">Status <span style="color: #d9534f;">*</span></label>
                    <select name="status" class="form-select" required aria-required="true">
                        <option value="">Select Status</option>
                        {% for key, val in status_choices %}
                            <option value="{{ key }}" {% if key == 'Active' %}selected{% endif %}>{{ val }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="field-label">Auto QR Code</label>
                    <div class="qr-badge-alert">
                        <i class="fa-solid fa-qrcode fs-6 text-success"></i>
                        <span>QR code with logo will be auto-generated upon saving.</span>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button type="submit" class="action-btn save-btn">✔ Save</button>
                <a href="{% url 'donation_box_page' %}" class="action-btn back-btn">← Back</a>
            </div>
        </form>
    </div>
</div>

<script>
$(document).ready(function() {
    if ($.fn.select2) {
        $('#assigned_to').select2({
            placeholder: "Select Donor",
            allowClear: true,
            width: '100%',
            templateSelection: function(data) {
                return data.text ? data.text.trim() : data.text;
            }
        });
        $('#box_owner').select2({
            placeholder: "Select Collector",
            allowClear: false,
            width: '100%',
            templateSelection: function(data) {
                return data.text ? data.text.trim() : data.text;
            }
        });
    }
});
</script>
{% endblock %}
