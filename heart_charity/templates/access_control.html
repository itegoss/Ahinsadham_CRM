{% extends 'base.html' %}
{% load custom_tags %}
{% block content %}
<style>
    .action-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 35px;
    }
    .action-btn {
        padding: 12px 40px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: .3s ease;
        display: inline-block;
    }
    .save-btn {
        background: #0f7b34;
        color: white;
    }
    .save-btn:hover {
        background: #0c622a;
        transform: translateY(-2px);
    }
    .back-btn {
        background: #6b6f75;
        color: white;
    }
    .back-btn:hover {
        background: #4b4f54;
        transform: translateY(-2px);
    }
    @media (max-width: 755px) {
        .action-buttons {
            flex-direction: column;
            width: 100%;
            align-items: center;
            gap: 15px;
        }
        .action-btn {
            width: 80%;
            text-align: center;
        }
    }
    @media (max-width: 768px) {
        .row { flex-direction: column; }
        .col-6 { width: 100%; }
        .container-box { padding: 30px; }
    }
.permission-card {
    border-radius: 14px;
    transition: 0.3s;
}
.permission-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
}
.permission-title {
    font-weight: 600;
    color: #198754;
    letter-spacing: 0.5px;
}
.permission-label {
    font-weight: 500;
}
.form-select, .form-control {
    border-radius: 10px;
}
.checkbox-label {
    margin-right: 25px;
}
</style>

<form method="POST" action="{% url 'access_control' %}">
    {% csrf_token %}
    <div class="container mt-4">
        <div class="card p-4 shadow permission-card mb-4">
            <h4 class="text-center permission-title mb-4">User Role & Description</h4>
            {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}
            <div class="row">
                <div class="col-md-6 mb-3">
                              <label class="permission-label">Role Name <span style="color:#d9534f;">*</span></label>
                              <input type="text" name="role_name" value="{{ user_role|default_if_none:'' }}"
                                  class="form-control p-2" placeholder="Enter role name" required aria-required="true">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="permission-label">Role Description</label>
                    <input type="text" name="roleDescription" value="{{ user_description|default_if_none:'' }}"
                           class="form-control p-2" placeholder="Enter role description">
                </div>
            </div>
            <div class="mb-3 position-relative">
                <label class="permission-label mb-2">Select Module(s) <span style="color:#d9534f;">*</span></label>
                <div class="dropdown w-100">
                    <button class="form-control text-start p-2 d-flex justify-content-between align-items-center dropdown-toggle" type="button" id="multiSelectDropdown" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="background-color: #fff; border-radius: 10px;">
                        <span id="selectedModulesText" class="text-muted">-- Choose Module(s) --</span>
                    </button>
                    <div class="dropdown-menu w-100 p-3 shadow" aria-labelledby="multiSelectDropdown" style="max-height: 250px; overflow-y: auto; border-radius: 10px; min-width: 100% !important;">
                        <div class="form-check mb-2 pb-2 border-bottom">
                            <input class="form-check-input" type="checkbox" id="selectAllModules" style="cursor: pointer;">
                            <label class="form-check-label fw-bold text-success" for="selectAllModules" style="cursor: pointer;">
                                Select All
                            </label>
                        </div>
                        <div class="row row-cols-1 g-2">
                            {% for module in modules %}
                                <div class="col">
                                    <div class="form-check">
                                        <input class="form-check-input module-checkbox" type="checkbox" name="selected_modules" value="{{ module.id }}" id="module_{{ module.id }}" style="cursor: pointer;">
                                        <label class="form-check-label w-100" for="module_{{ module.id }}" style="cursor: pointer;">
                                            {{ module.module_name }}
                                        </label>
                                    </div>
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
            <label class="permission-label">Select Permissions</label><br>
            <div class="mt-2">
                <div class="form-check form-check-inline checkbox-label">
                    <input class="form-check-input" type="checkbox" name="access_permission" value="1">
                    <label class="form-check-label">Access</label>
                </div>

                <div class="form-check form-check-inline checkbox-label">
                    <input class="form-check-input" type="checkbox" name="add_permission" value="1">
                    <label class="form-check-label">Create</label>
                </div>

                <div class="form-check form-check-inline checkbox-label">
                    <input class="form-check-input" type="checkbox" name="edit_permission" value="1">
                    <label class="form-check-label">Update</label>
                </div>

                <div class="form-check form-check-inline checkbox-label">
                    <input class="form-check-input" type="checkbox" name="delete_permission" value="1">
                    <label class="form-check-label">Delete</label>
                </div>

                <div class="form-check form-check-inline checkbox-label">
                    <input class="form-check-input" type="checkbox" name="view_permission" value="1">
                    <label class="form-check-label">View</label>
                </div>
            </div>
   <div class="action-buttons">
        <button type="submit" class="action-btn btn-submit save-btn">✔ Save</button>
        <a href="/welcome/?tab=Donation Module" class="action-btn back-btn">← Back    </a>
    </div>
    </div>
    </div>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const selectAllCheckbox = document.getElementById('selectAllModules');
        const moduleCheckboxes = document.querySelectorAll('.module-checkbox');
        const selectedModulesText = document.getElementById('selectedModulesText');
        const form = document.querySelector('form');

        function updateDropdownText() {
            const checkedBoxes = Array.from(moduleCheckboxes).filter(cb => cb.checked);
            if (checkedBoxes.length === 0) {
                selectedModulesText.textContent = '-- Choose Module(s) --';
                selectedModulesText.classList.add('text-muted');
            } else {
                selectedModulesText.classList.remove('text-muted');
                if (checkedBoxes.length === moduleCheckboxes.length) {
                    selectedModulesText.textContent = 'All Modules Selected (' + checkedBoxes.length + ')';
                } else if (checkedBoxes.length <= 2) {
                    const names = checkedBoxes.map(cb => cb.nextElementSibling.textContent.trim()).join(', ');
                    selectedModulesText.textContent = names;
                } else {
                    selectedModulesText.textContent = checkedBoxes.length + ' Modules Selected';
                }
            }
        }

        if (selectAllCheckbox) {
            selectAllCheckbox.addEventListener('change', function() {
                const isChecked = this.checked;
                moduleCheckboxes.forEach(cb => {
                    cb.checked = isChecked;
                });
                updateDropdownText();
            });

            moduleCheckboxes.forEach(cb => {
                cb.addEventListener('change', function() {
                    const allChecked = Array.from(moduleCheckboxes).every(c => c.checked);
                    selectAllCheckbox.checked = allChecked;
                    updateDropdownText();
                });
            });
        }

        if (form) {
            form.addEventListener('submit', function(event) {
                const anyChecked = Array.from(moduleCheckboxes).some(cb => cb.checked);
                if (!anyChecked) {
                    event.preventDefault();
                    alert('Please select at least one module.');
                }
            });
        }

        // Initialize text on load
        updateDropdownText();
    });
</script>
{% endblock %}
